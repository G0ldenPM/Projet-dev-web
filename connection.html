<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Connexion — Auto Prestige</title>
    <link rel="stylesheet" href="CSS.css">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <h1>AUTO<br>PRESTIGE</h1>
        <p class="subtitle">Connectez-vous à votre compte</p>
 
        <form id="loginForm">
            <div>
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>
            </div>
            <div>
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" style="margin-top:8px;">Se connecter</button>
        </form>
 
        <div style="margin-top: 16px;">
            <button id="forgotLink" class="boutton-ghost" style="width:100%;">Mot de passe oublié ?</button>
        </div>
 
        <div id="forgotSection" style="display:none; margin-top:20px;">
            <h2 style="font-size:1.3rem; margin-bottom:14px; color: var(--rouge);">Réinitialiser</h2>
            <form id="forgotForm">
                <div>
                    <label for="resetEmail">Votre adresse e-mail</label>
                    <input type="email" id="resetEmail" placeholder="exemple@mail.com" required>
                </div>
                <button type="submit">Envoyer le lien</button>
            </form>
            <a href="#" id="backToLogin" style="display:block; margin-top:12px; font-size:0.85rem; color: var(--gris-clair);">← Retour à la connexion</a>
            <p id="forgotMessage" style="display:none; color:#4caf50; margin-top:10px; font-size:0.88rem;">
                ✓ Email envoyé ! Vérifiez votre boîte mail.
            </p>
        </div>
    </div>
</div>
<script src="login.js"></script>
</body>
</html>
