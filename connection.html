<!DOCTYPE html>
<html>
<head>
    <title>Connection</title>
</head>
<body style="background-color: lightgray;">
    <h1>Connection</h1>
    <form>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        <button type="submit">Connect</button>
    </form>
    <button href="#" id="forgotLink">Mot de passe oublié</button>
    <div id="forgotSection" style="display:none;">
        <h2>Réinitialiser le mot de passe</h2>
        <form id="forgotForm">
            <label for="resetEmail">Votre email :</label>
            <input type="email" id="resetEmail" required>
            <br>
            <button type="submit">Envoyer le lien</button>
        </form>
        <br>
        <a href="#" id="backToLogin">← Retour à la connexion</a>
        <p id="forgotMessage" style="display:none; color:green;">
            Email envoyé ! Vérifiez votre boîte mail.
        </p>
    </div>
    <script src="login.js"></script>
</body>
</html>
